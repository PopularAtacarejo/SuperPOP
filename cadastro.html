<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SuperPop | Cadastro</title>
<link href="https://i.ibb.co/99R7YqxF/Icon.png" rel="icon" type="image/png"/>
<style>
  :root {
    --primary: #e63946;
    --bg: #ffffff;
    --surface: #f8f9fa;
    --text: #1f1a1c;
    --muted: #6b7280;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --danger-text: #b91c1c;
    --ok-bg: #f0fdf4;
    --ok-border: #bbf7d0;
    --ok-text: #15803d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Nunito", Arial, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(#e6394633 0.7px, transparent 0.7px), radial-gradient(#ffb70333 0.7px, #fff 0.7px);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }

  .page {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    z-index: 1;
  }
  .site-footer {
    padding: 12px 16px 18px;
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    position: relative;
    z-index: 1;
  }
  .floating-icons-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .floating-icon {
    position: absolute;
    opacity: 0.14;
    color: #e63946;
    animation: floatIcon 7s ease-in-out infinite;
    user-select: none;
  }
  .floating-icon.alt {
    color: #ffb703;
    opacity: 0.18;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(8deg); }
  }

  .card {
    width: min(720px, 100%);
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #f1f5f9;
    border-radius: 20px;
    box-shadow: 0 18px 44px -14px rgba(0, 0, 0, 0.12);
    padding: 24px;
  }

  .logo {
    display: block;
    width: min(260px, 72vw);
    height: auto;
    margin: 0 auto 10px;
  }

  h1 {
    margin: 0;
    text-align: center;
    color: var(--primary);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    letter-spacing: 0.02em;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-weight: 700;
    margin: 8px 0 22px;
  }

  form {
    display: grid;
    gap: 14px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 6px 2px;
  }

  input {
    width: 100%;
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.98rem;
    font-weight: 700;
    outline: none;
  }
  select {
    width: 100%;
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.98rem;
    font-weight: 700;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, #2d2d2d 50%),
      linear-gradient(135deg, #2d2d2d 50%, transparent 50%);
    background-position:
      calc(100% - 22px) calc(50% - 4px),
      calc(100% - 14px) calc(50% - 4px);
    background-size: 8px 8px, 8px 8px;
    background-repeat: no-repeat;
    padding-right: 40px;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px #e6394630;
    background: #fff;
  }
  select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px #e6394630;
    background-color: #fff;
  }
  .funcao-select-mobile {
    display: none;
  }

  .status {
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.9rem;
    font-weight: 700;
    display: none;
  }

  .status.error {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-text);
  }

  .status.ok {
    background: var(--ok-bg);
    border: 1px solid var(--ok-border);
    color: var(--ok-text);
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  button {
    border: 0;
    background: var(--primary);
    color: #fff;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .hint {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .login-link {
    margin-left: auto;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
  }

  .login-link:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .card { padding: 18px; }
    .actions { align-items: stretch; }
    button { width: 100%; }
    .login-link { margin-left: 0; }
  }
  @media (max-width: 768px) {
    .funcao-input-desktop {
      display: none;
    }
    .funcao-select-mobile {
      display: block;
    }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<div class="floating-icons-bg" aria-hidden="true">
  <span class="floating-icon material-symbols-outlined" style="top: 8%; left: 14%; font-size: 30px; animation-delay: -0.8s;">stars</span>
  <span class="floating-icon alt material-symbols-outlined" style="top: 12%; right: 18%; font-size: 34px; animation-delay: -1.7s;">emoji_events</span>
  <span class="floating-icon material-symbols-outlined" style="top: 26%; left: 8%; font-size: 24px; animation-delay: -2.9s;">favorite</span>
  <span class="floating-icon alt material-symbols-outlined" style="top: 34%; right: 11%; font-size: 24px; animation-delay: -3.4s;">celebration</span>
  <span class="floating-icon material-symbols-outlined" style="top: 56%; left: 10%; font-size: 28px; animation-delay: -4.1s;">workspace_premium</span>
  <span class="floating-icon alt material-symbols-outlined" style="top: 63%; right: 16%; font-size: 30px; animation-delay: -5.3s;">volunteer_activism</span>
  <span class="floating-icon material-symbols-outlined" style="bottom: 18%; left: 28%; font-size: 24px; animation-delay: -2.2s;">kid_star</span>
  <span class="floating-icon alt material-symbols-outlined" style="bottom: 11%; right: 27%; font-size: 24px; animation-delay: -4.7s;">auto_awesome</span>
</div>
<div class="page">
  <section class="card">
    <img alt="SuperPop" class="logo" src="https://i.ibb.co/VpLWwfNB/Gemini-Generated-Image-1aiacj1aiacj1aia.png"/>
    <h1>Cadastro de Funcionário</h1>
    <p class="subtitle">Preencha os dados para criar seu acesso.</p>

    <form id="cadastroForm" novalidate>
      <div>
        <label for="nome">Nome</label>
        <input id="nome" maxlength="80" placeholder="Insira seu nome" required type="text"/>
      </div>

      <div>
        <label for="funcao">Função</label>
        <input class="funcao-input-desktop" id="funcao" list="listaFuncoesSupermercado" maxlength="80" placeholder="Ex: Operador de Caixa" required type="text"/>
        <select class="funcao-select-mobile" id="funcaoSelectMobile">
          <option value="">Selecione uma função</option>
        </select>
        <datalist id="listaFuncoesSupermercado"></datalist>
      </div>

      <div>
        <label for="numeroCelular">Número de celular</label>
        <input id="numeroCelular" inputmode="numeric" maxlength="18" placeholder="(82) 9 0000-0000" required type="text"/>
      </div>

      <div>
        <label for="email">E-mail (opcional)</label>
        <input id="email" maxlength="120" placeholder="nome@empresa.com.br" type="email"/>
      </div>

      <div>
        <label for="senha">Senha</label>
        <input id="senha" minlength="6" placeholder="Insira sua senha" required type="password"/>
      </div>

      <div class="status error" id="statusErro"></div>
      <div class="status ok" id="statusSucesso"></div>

      <div class="actions">
        <button id="submitBtn" type="submit"><span id="submitBtnLabel">Cadastrar</span></button>
        <a class="login-link" href="index.html">Já tem conta? Entrar</a>
      </div>

    </form>
  </section>
</div>
<footer class="site-footer">Super POP! Popular Atacarejo Todos os Direitos Reservados - 2026 V:1.0.0</footer>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("cadastroForm");
    const nomeInput = document.getElementById("nome");
    const funcaoInput = document.getElementById("funcao");
    const funcaoSelectMobile = document.getElementById("funcaoSelectMobile");
    const numeroInput = document.getElementById("numeroCelular");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");
    const listaFuncoesEl = document.getElementById("listaFuncoesSupermercado");
    const submitBtn = document.getElementById("submitBtn");
    const submitBtnLabel = document.getElementById("submitBtnLabel");
    const statusErro = document.getElementById("statusErro");
    const statusSucesso = document.getElementById("statusSucesso");
    const FUNCOES_SOURCE_URL = "https://github.com/PopularAtacarejo/SuperPOP/blob/main/FuncoesSupermercado.json";
    const PHONE_REGEX = /^\(\d{2}\)\s9\s\d{4}\s-\s\d{4}$/;
    const apiBase = String(window.SUPERPOP_API_URL || "https://superpopbackend.onrender.com").replace(/\/+$/, "");
    const frontendBase = String(window.SUPERPOP_FRONTEND_URL || "https://popularatacarejo.github.io/SuperPOP").replace(/\/+$/, "");

    function resolveOrigin(urlValue) {
      try {
        return new URL(String(urlValue || "")).origin.toLowerCase();
      } catch (_err) {
        return "";
      }
    }

    function buildFrontendUrl(path) {
      const cleanPath = String(path || "").replace(/^\/+/, "");
      const currentOrigin = String(window.location.origin || "").toLowerCase();
      const apiOrigin = resolveOrigin(apiBase);
      if (apiOrigin && currentOrigin && apiOrigin === currentOrigin) {
        return cleanPath ? ("/" + cleanPath) : "/";
      }
      return frontendBase ? (frontendBase + "/" + cleanPath) : (cleanPath || ".");
    }

    function formatPhoneMask(value) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 11);
      if (!digits) return "";
      if (digits.length <= 2) return "(" + digits;
      if (digits.length <= 3) return "(" + digits.slice(0, 2) + ") " + digits.slice(2);
      if (digits.length <= 7) return "(" + digits.slice(0, 2) + ") " + digits.slice(2, 3) + " " + digits.slice(3);
      return "(" + digits.slice(0, 2) + ") " + digits.slice(2, 3) + " " + digits.slice(3, 7) + " - " + digits.slice(7, 11);
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtnLabel.textContent = isLoading ? "Salvando..." : "Cadastrar";
    }

    function showError(message) {
      statusSucesso.style.display = "none";
      statusErro.textContent = message;
      statusErro.style.display = "block";
    }

    function showSuccess(message) {
      statusErro.style.display = "none";
      statusSucesso.textContent = message;
      statusSucesso.style.display = "block";
    }

    function isMobileViewport() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function getFuncaoValue() {
      const inputValue = String((funcaoInput && funcaoInput.value) || "").trim();
      const selectValue = String((funcaoSelectMobile && funcaoSelectMobile.value) || "").trim();
      return isMobileViewport() ? (selectValue || inputValue) : (inputValue || selectValue);
    }

    numeroInput.addEventListener("input", function () {
      const cursorAtEnd = numeroInput.selectionStart === numeroInput.value.length;
      numeroInput.value = formatPhoneMask(numeroInput.value);
      if (cursorAtEnd) {
        numeroInput.setSelectionRange(numeroInput.value.length, numeroInput.value.length);
      }
    });

    function normalizeGithubBlobUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.hostname === "github.com") {
          const parts = parsed.pathname.split("/").filter(Boolean);
          if (parts.length >= 5 && parts[2] === "blob") {
            const owner = parts[0];
            const repo = parts[1];
            const branch = parts[3];
            const filePath = parts.slice(4).join("/");
            return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + branch + "/" + filePath;
          }
        }
      } catch (_err) {}
      return url;
    }

    async function loadFuncoesAutocomplete() {
      if (!listaFuncoesEl) return;
      const sources = [
        normalizeGithubBlobUrl(FUNCOES_SOURCE_URL),
        "./FuncoesSupermercado.json"
      ];
      try {
        let payload = null;
        for (const source of sources) {
          try {
            const response = await fetch(source, { cache: "no-store" });
            if (!response.ok) {
              continue;
            }
            payload = await response.json();
            if (Array.isArray(payload)) {
              break;
            }
          } catch (_err) {}
        }
        if (!Array.isArray(payload)) {
          throw new Error("Fonte de funcoes indisponivel");
        }
        const funcoes = Array.isArray(payload) ? payload : [];
        const uniqueSorted = Array.from(new Set(funcoes.map(function (item) { return String(item || "").trim(); }).filter(Boolean)))
          .sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
        listaFuncoesEl.innerHTML = "";
        if (funcaoSelectMobile) {
          funcaoSelectMobile.innerHTML = "";
          const placeholderOption = document.createElement("option");
          placeholderOption.value = "";
          placeholderOption.textContent = "Selecione uma função";
          funcaoSelectMobile.appendChild(placeholderOption);
        }
        uniqueSorted.forEach(function (funcao) {
          const option = document.createElement("option");
          option.value = funcao;
          listaFuncoesEl.appendChild(option);
          if (funcaoSelectMobile) {
            const selectOption = document.createElement("option");
            selectOption.value = funcao;
            selectOption.textContent = funcao;
            funcaoSelectMobile.appendChild(selectOption);
          }
        });
      } catch (_err) {
        listaFuncoesEl.innerHTML = "";
        if (funcaoSelectMobile) {
          funcaoSelectMobile.innerHTML = '<option value="">Selecione uma função</option>';
        }
      }
    }

    if (funcaoSelectMobile && funcaoInput) {
      funcaoSelectMobile.addEventListener("change", function () {
        funcaoInput.value = String(funcaoSelectMobile.value || "").trim();
      });
      funcaoInput.addEventListener("input", function () {
        const normalized = String(funcaoInput.value || "").trim();
        if (!normalized) {
          funcaoSelectMobile.value = "";
        } else if (Array.from(funcaoSelectMobile.options).some(function (option) { return option.value === normalized; })) {
          funcaoSelectMobile.value = normalized;
        }
      });
    }

    loadFuncoesAutocomplete();

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      statusErro.style.display = "none";
      statusSucesso.style.display = "none";

      const payload = {
        nome: String(nomeInput.value || "").trim(),
        funcao: getFuncaoValue(),
        numero_celular: String(numeroInput.value || "").trim(),
        email: String(emailInput.value || "").trim(),
        senha: String(senhaInput.value || "")
      };

      if (payload.nome.length < 3) {
        showError("Informe um nome válido com pelo menos 3 caracteres.");
        return;
      }
      if (payload.funcao.length < 2) {
        showError("Informe uma função válida.");
        return;
      }
      if (!PHONE_REGEX.test(payload.numero_celular)) {
        showError("Número de celular inválido. Use o formato (xx) 9 0000 - 0000.");
        return;
      }
      if (payload.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) {
        showError("E-mail inválido.");
        return;
      }
      if (payload.senha.length < 6) {
        showError("A senha deve ter pelo menos 6 caracteres.");
        return;
      }

      setLoading(true);
      try {
        const response = await fetch(apiBase + "/api/funcionarios/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload)
        });
        const result = await response.json().catch(function () { return {}; });
        if (!response.ok || !result.ok) {
          throw new Error(String(result.error || "Não foi possível concluir o cadastro."));
        }

        form.reset();
        if (funcaoSelectMobile) {
          funcaoSelectMobile.value = "";
        }
        showSuccess("Cadastro finalizado com sucesso. Redirecionando para o login...");
        window.setTimeout(function () {
          window.location.href = buildFrontendUrl("index.html?registered=1");
        }, 900);
      } catch (err) {
        showError(String(err && err.message ? err.message : "Erro inesperado ao cadastrar."));
      } finally {
        setLoading(false);
      }
    });
  });
</script>
</body></html>
