<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SuperPop | Login</title>
<link href="https://i.ibb.co/99R7YqxF/Icon.png" rel="icon" type="image/png"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#E63946",secondary:"#FFB703","surface-light":"#F8F9FA"},fontFamily:{display:["Fredoka One","cursive"],body:["Nunito","sans-serif"]},boxShadow:{card:"0 15px 40px -10px rgba(0, 0, 0, 0.12)"}}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
.bg-pattern{background-color:#fff;background-image:radial-gradient(#E63946 .5px,transparent .5px),radial-gradient(#FFB703 .5px,#fff .5px);background-size:20px 20px;background-position:0 0,10px 10px;opacity:.4;position:fixed;inset:0;z-index:-1;pointer-events:none}
.floating-icons-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.floating-icon{position:absolute;opacity:.12;color:#e63946;animation:floatIcon 7s ease-in-out infinite}
.floating-icon.alt{color:#ffb703;opacity:.16}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(8deg)}}
</style>
</head>
<body class="min-h-screen flex flex-col font-body bg-white text-gray-900">
<div class="bg-pattern"></div>
<div aria-hidden="true" class="floating-icons-bg">
<span class="floating-icon material-symbols-outlined text-3xl" style="top:8%;left:14%;animation-delay:-0.8s;">stars</span>
<span class="floating-icon alt material-symbols-outlined text-4xl" style="top:12%;right:18%;animation-delay:-1.7s;">emoji_events</span>
<span class="floating-icon material-symbols-outlined text-2xl" style="top:26%;left:6%;animation-delay:-2.9s;">favorite</span>
<span class="floating-icon alt material-symbols-outlined text-2xl" style="top:34%;right:10%;animation-delay:-3.4s;">celebration</span>
<span class="floating-icon material-symbols-outlined text-3xl" style="top:55%;left:10%;animation-delay:-4.1s;">workspace_premium</span>
<span class="floating-icon alt material-symbols-outlined text-3xl" style="top:62%;right:16%;animation-delay:-5.3s;">volunteer_activism</span>
<span class="floating-icon material-symbols-outlined text-2xl" style="bottom:20%;left:30%;animation-delay:-2.2s;">kid_star</span>
<span class="floating-icon alt material-symbols-outlined text-2xl" style="bottom:12%;right:28%;animation-delay:-4.7s;">auto_awesome</span>
</div>
<main class="flex-1 flex items-center justify-center px-5 py-8">
<section class="w-full max-w-md bg-white/95 border border-white/60 rounded-2xl shadow-card p-6 sm:p-8">
<div class="text-center mb-6">
<img alt="SuperPop" class="mx-auto w-40 h-auto mb-3" src="https://i.ibb.co/VpLWwfNB/Gemini-Generated-Image-1aiacj1aiacj1aia.png"/>
<h1 class="font-display text-3xl text-primary uppercase tracking-tight">Login</h1>
<p class="text-sm text-gray-600 font-semibold mt-2">Acesse com seu telefone ou e-mail e senha.</p>
</div>

<form class="space-y-4" id="loginForm" novalidate>
<div>
<label class="block text-xs font-bold text-primary uppercase mb-1.5 ml-1" for="numeroCelular">Telefone ou e-mail</label>
<input class="w-full px-4 py-3.5 bg-surface-light border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-semibold placeholder-gray-400 text-gray-800 shadow-sm" id="numeroCelular" inputmode="text" maxlength="120" placeholder="(82) 9 0000 - 0000 ou nome@empresa.com" required type="text"/>
</div>
<div>
<label class="block text-xs font-bold text-primary uppercase mb-1.5 ml-1" for="senha">Senha</label>
<div class="relative">
<input class="w-full pl-4 pr-12 py-3.5 bg-surface-light border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-semibold placeholder-gray-400 text-gray-800 shadow-sm" id="senha" placeholder="Insira sua senha" required type="password"/>
<button aria-label="Mostrar senha" class="absolute right-3 top-1/2 -translate-y-1/2 inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 hover:text-primary hover:bg-red-50 transition-colors" id="toggleSenha" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleSenhaIcon">visibility</span>
</button>
</div>
</div>
<label class="flex items-center gap-2 text-sm font-semibold text-gray-600 select-none cursor-pointer">
<input class="rounded border-gray-300 text-primary focus:ring-primary" id="manterConectado" type="checkbox"/>
<span>Manter conectado por 24h</span>
</label>
<div class="rounded-xl bg-red-50 border border-red-100 px-4 py-3 text-sm font-semibold text-red-700 hidden" id="statusErro"></div>
<div class="rounded-xl bg-green-50 border border-green-100 px-4 py-3 text-sm font-semibold text-green-700 hidden" id="statusSucesso"></div>
<button class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-primary text-white font-bold tracking-wide shadow-md hover:bg-red-700 transition-colors disabled:opacity-70 disabled:cursor-not-allowed" id="submitBtn" type="submit">
<span class="material-symbols-outlined text-base">login</span>
<span id="submitBtnLabel">Entrar</span>
</button>
<div class="flex items-center justify-between gap-3 text-xs">
<button class="font-bold text-primary hover:underline" id="forgotPasswordBtn" type="button">Esqueci minha senha</button>
<p class="text-right text-gray-500">Sem cadastro? <a class="text-primary font-bold hover:underline" href="cadastro.html">Cadastre-se</a></p>
</div>
</form>

<form class="space-y-4 hidden" id="forgotPasswordForm" novalidate>
<div>
<label class="block text-xs font-bold text-primary uppercase mb-1.5 ml-1" for="recoveryEmail">E-mail de recuperação</label>
<input class="w-full px-4 py-3.5 bg-surface-light border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-semibold placeholder-gray-400 text-gray-800 shadow-sm" id="recoveryEmail" maxlength="120" placeholder="nome@empresa.com" type="email"/>
</div>
<button class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-primary text-white font-bold tracking-wide shadow-md hover:bg-red-700 transition-colors disabled:opacity-70 disabled:cursor-not-allowed" id="forgotSubmitBtn" type="submit">
<span class="material-symbols-outlined text-base">mail</span>
<span id="forgotSubmitLabel">Enviar link</span>
</button>
<button class="w-full text-sm font-bold text-slate-500 hover:text-primary" id="backToLoginBtn" type="button">Voltar para o login</button>
</form>

<form class="space-y-4 hidden" id="resetPasswordForm" novalidate>
<div>
<label class="block text-xs font-bold text-primary uppercase mb-1.5 ml-1" for="resetNovaSenha">Nova senha</label>
<input class="w-full px-4 py-3.5 bg-surface-light border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-semibold placeholder-gray-400 text-gray-800 shadow-sm" id="resetNovaSenha" minlength="6" placeholder="Digite a nova senha" type="password"/>
</div>
<div>
<label class="block text-xs font-bold text-primary uppercase mb-1.5 ml-1" for="resetConfirmarSenha">Confirmar nova senha</label>
<input class="w-full px-4 py-3.5 bg-surface-light border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-semibold placeholder-gray-400 text-gray-800 shadow-sm" id="resetConfirmarSenha" minlength="6" placeholder="Repita a nova senha" type="password"/>
</div>
<button class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-primary text-white font-bold tracking-wide shadow-md hover:bg-red-700 transition-colors disabled:opacity-70 disabled:cursor-not-allowed" id="resetSubmitBtn" type="submit">
<span class="material-symbols-outlined text-base">lock_reset</span>
<span id="resetSubmitLabel">Redefinir senha</span>
</button>
<button class="w-full text-sm font-bold text-slate-500 hover:text-primary" id="cancelResetBtn" type="button">Voltar para o login</button>
</form>
</section>
</main>
<footer class="py-4 text-center">
<p class="text-xs font-bold tracking-wide text-gray-500">Super POP! Popular Atacarejo Todos os Direitos Reservados - 2026 V:1.0.0</p>
<p class="text-[11px] font-semibold text-gray-400 mt-1">Desenvolvido por: Jeferson</p>
</footer>
<script>
document.addEventListener("DOMContentLoaded",function(){
const query=new URLSearchParams(window.location.search),form=document.getElementById("loginForm"),forgotPasswordForm=document.getElementById("forgotPasswordForm"),resetPasswordForm=document.getElementById("resetPasswordForm"),phoneInput=document.getElementById("numeroCelular"),passwordInput=document.getElementById("senha"),recoveryEmailInput=document.getElementById("recoveryEmail"),resetNovaSenhaInput=document.getElementById("resetNovaSenha"),resetConfirmarSenhaInput=document.getElementById("resetConfirmarSenha"),rememberInput=document.getElementById("manterConectado"),toggleSenhaBtn=document.getElementById("toggleSenha"),toggleSenhaIcon=document.getElementById("toggleSenhaIcon"),forgotPasswordBtn=document.getElementById("forgotPasswordBtn"),backToLoginBtn=document.getElementById("backToLoginBtn"),cancelResetBtn=document.getElementById("cancelResetBtn"),statusErro=document.getElementById("statusErro"),statusSucesso=document.getElementById("statusSucesso"),submitBtn=document.getElementById("submitBtn"),submitBtnLabel=document.getElementById("submitBtnLabel"),forgotSubmitBtn=document.getElementById("forgotSubmitBtn"),forgotSubmitLabel=document.getElementById("forgotSubmitLabel"),resetSubmitBtn=document.getElementById("resetSubmitBtn"),resetSubmitLabel=document.getElementById("resetSubmitLabel"),PHONE_REGEX=/^\(\d{2}\)\s9\s\d{4}\s-\s\d{4}$/,EMAIL_REGEX=/^[^\s@]+@[^\s@]+\.[^\s@]+$/,apiBase=String(window.SUPERPOP_API_URL||"https://superpopbackend.onrender.com").replace(/\/+$/,""),frontendBase=String(window.SUPERPOP_FRONTEND_URL||"https://popularatacarejo.github.io/SuperPOP").replace(/\/+$/,""),resetToken=String(query.get("reset_token")||"").trim();
function resolveOrigin(urlValue){try{return new URL(String(urlValue||"")).origin.toLowerCase()}catch(_err){return""}}
function buildFrontendUrl(path){const cleanPath=String(path||"").replace(/^\/+/,""),currentOrigin=String(window.location.origin||"").toLowerCase(),apiOrigin=resolveOrigin(apiBase);if(apiOrigin&&currentOrigin&&apiOrigin===currentOrigin)return cleanPath?"/"+cleanPath:"/";return frontendBase?frontendBase+"/"+cleanPath:(cleanPath||".")}
function clearMessages(){statusErro.classList.add("hidden");statusSucesso.classList.add("hidden")}
function showError(message){statusSucesso.classList.add("hidden");statusErro.textContent=message;statusErro.classList.remove("hidden")}
function showSuccess(message){statusErro.classList.add("hidden");statusSucesso.textContent=message;statusSucesso.classList.remove("hidden")}
function showPanel(mode){form.classList.toggle("hidden",mode!=="login");forgotPasswordForm.classList.toggle("hidden",mode!=="forgot");resetPasswordForm.classList.toggle("hidden",mode!=="reset");clearMessages()}
function formatPhoneMask(value){const digits=String(value||"").replace(/\D/g,"").slice(0,11);if(!digits)return"";if(digits.length<=2)return"("+digits;if(digits.length<=3)return"("+digits.slice(0,2)+") "+digits.slice(2);if(digits.length<=7)return"("+digits.slice(0,2)+") "+digits.slice(2,3)+" "+digits.slice(3);return"("+digits.slice(0,2)+") "+digits.slice(2,3)+" "+digits.slice(3,7)+" - "+digits.slice(7,11)}
function shouldFormatAsPhone(value){return /^[\d()\s-]*$/.test(String(value||""))}
function setLoading(isLoading){submitBtn.disabled=isLoading;submitBtnLabel.textContent=isLoading?"Entrando...":"Entrar"}
function setForgotLoading(isLoading){forgotSubmitBtn.disabled=isLoading;forgotSubmitLabel.textContent=isLoading?"Enviando...":"Enviar link"}
function setResetLoading(isLoading){resetSubmitBtn.disabled=isLoading;resetSubmitLabel.textContent=isLoading?"Salvando...":"Redefinir senha"}
function waitMs(ms){return new Promise(function(resolve){window.setTimeout(resolve,ms)})}
async function ensureSessionReady(){const maxAttempts=5;let lastError="Nao foi possivel confirmar a sessao.";for(let attempt=1;attempt<=maxAttempts;attempt+=1){try{const response=await fetch(apiBase+"/api/auth/me",{cache:"no-store",credentials:"include"}),payload=await response.json().catch(function(){return{}});if(response.ok&&payload&&payload.ok&&payload.usuario)return payload.usuario;lastError=response.status===401?"Sessao nao confirmada pelo navegador.":"Falha ao validar sessao (HTTP "+response.status+")."}catch(err){lastError=String(err&&err.message?err.message:"Falha de rede ao validar sessao.")}if(attempt<maxAttempts)await waitMs(450*attempt)}throw new Error(lastError)}
if(rememberInput)rememberInput.checked=true;
if(query.get("registered")==="1")showSuccess("Cadastro finalizado com sucesso. Faca login para continuar.");
if(query.get("reset")==="1")showSuccess("Senha redefinida com sucesso. Faca login para continuar.");
if(resetToken)showPanel("reset");
phoneInput.addEventListener("input",function(){const currentValue=String(phoneInput.value||"");if(currentValue.indexOf("@")>=0||!shouldFormatAsPhone(currentValue))return;const cursorAtEnd=phoneInput.selectionStart===phoneInput.value.length;phoneInput.value=formatPhoneMask(currentValue);if(cursorAtEnd)phoneInput.setSelectionRange(phoneInput.value.length,phoneInput.value.length)});
toggleSenhaBtn.addEventListener("click",function(){const isPassword=passwordInput.type==="password";passwordInput.type=isPassword?"text":"password";toggleSenhaIcon.textContent=isPassword?"visibility_off":"visibility";toggleSenhaBtn.setAttribute("aria-label",isPassword?"Ocultar senha":"Mostrar senha")});
forgotPasswordBtn.addEventListener("click",function(){showPanel("forgot");recoveryEmailInput.focus()});
backToLoginBtn.addEventListener("click",function(){showPanel("login")});
cancelResetBtn.addEventListener("click",function(){window.location.href=buildFrontendUrl("index.html")});
form.addEventListener("submit",async function(event){event.preventDefault();clearMessages();const loginValue=String(phoneInput.value||"").trim(),senha=String(passwordInput.value||""),manterConectado=Boolean(rememberInput&&rememberInput.checked),isEmailLogin=loginValue.indexOf("@")>=0;if(isEmailLogin){if(!EMAIL_REGEX.test(loginValue)){showError("E-mail invalido.");return}}else if(!PHONE_REGEX.test(loginValue)){showError("Numero de celular invalido. Use o formato (xx) 9 0000 - 0000.");return}if(!senha){showError("Informe a senha.");return}setLoading(true);try{const response=await fetch(apiBase+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({numero_celular:loginValue,login:loginValue,senha:senha,manter_conectado:manterConectado})}),result=await response.json().catch(function(){return{}});if(!response.ok||!result.ok)throw new Error(String(result.error||"Falha ao fazer login."));try{localStorage.setItem("superpop_auth_user",JSON.stringify(result.funcionario||{}))}catch(_err){}showSuccess("Login realizado. Confirmando sessao...");await ensureSessionReady();showSuccess("Sessao ativa. Redirecionando...");window.setTimeout(function(){window.location.href=buildFrontendUrl("superpop.html")},350)}catch(err){const message=String(err&&err.message?err.message:"Erro inesperado ao fazer login.");if(message.toLowerCase().indexOf("sessao")>=0)showError(message+" Verifique cookies de terceiros para superpopbackend.onrender.com.");else showError(message)}finally{setLoading(false)}});
forgotPasswordForm.addEventListener("submit",async function(event){event.preventDefault();clearMessages();const email=String(recoveryEmailInput.value||"").trim().toLowerCase();if(!EMAIL_REGEX.test(email)){showError("Informe um e-mail valido.");return}setForgotLoading(true);try{const response=await fetch(apiBase+"/api/auth/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email})}),payload=await response.json().catch(function(){return{}});if(!response.ok||!payload.ok)throw new Error(String(payload.error||"Falha ao solicitar recuperacao."));showSuccess(String(payload.message||"Se existir uma conta com esse email, enviamos o link de recuperacao."))}catch(error){showError(String(error&&error.message||"Erro ao solicitar recuperacao."))}finally{setForgotLoading(false)}});
resetPasswordForm.addEventListener("submit",async function(event){event.preventDefault();clearMessages();const novaSenha=String(resetNovaSenhaInput.value||""),confirmarSenha=String(resetConfirmarSenhaInput.value||"");if(novaSenha.length<6){showError("A nova senha deve ter pelo menos 6 caracteres.");return}if(novaSenha!==confirmarSenha){showError("A confirmacao da nova senha nao confere.");return}setResetLoading(true);try{const response=await fetch(apiBase+"/api/auth/password-reset/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:resetToken,nova_senha:novaSenha,confirmar_senha:confirmarSenha})}),payload=await response.json().catch(function(){return{}});if(!response.ok||!payload.ok)throw new Error(String(payload.error||"Falha ao redefinir senha."));showSuccess(String(payload.message||"Senha redefinida com sucesso."));window.setTimeout(function(){window.location.href=buildFrontendUrl("index.html?reset=1")},500)}catch(error){showError(String(error&&error.message||"Erro ao redefinir senha."))}finally{setResetLoading(false)}});
});
</script>
</body>
</html>
